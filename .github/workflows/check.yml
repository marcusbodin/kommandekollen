name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve glass-panel visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-panel-screenshots
          path: test-results/**/liquid-glass-*.png
          if-no-files-found: ignore
          retention-days: 3
