name: Manual private observations
on:
  workflow_dispatch:
    inputs:
      source:
        description: One reviewed private source
        required: true
        type: choice
        options:
          - notar
          - husmanhagberg
          - mohv
permissions:
  contents: read
concurrency:
  group: private-ingestion
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository_owner == 'marcusbodin' && github.actor == 'marcusbodin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect one bounded private observation batch
        run: node --import tsx scripts/collect-private.ts --source "$SOURCE"
        env:
          SOURCE: ${{ inputs.source }}
          AUTHORIZED_SOURCES: "[]"
          PRIVATE_OBSERVATION_SOURCES: ${{ secrets.PRIVATE_OBSERVATION_SOURCES }}
          INGEST_API_URL: ${{ vars.PUBLIC_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
