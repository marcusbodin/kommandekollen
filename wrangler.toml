name = "kommandekollen-api"
main = "worker/index.ts"
compatibility_date = "2025-09-24"
workers_dev = true

[vars]
SERVICE_ENABLED = "false"
PUBLIC_URL = "http://localhost:5173/"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
MAIL_FROM = ""
PRIVACY_CONTACT = ""
AUTHORIZED_SOURCES = "[]"

[[d1_databases]]
binding = "DB"
database_name = "kommandekollen"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = false

# Approved target architecture only; no resources or domain have been configured.
[env.production]
name = "kommandekollen-api"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.kommandekollen.se", custom_domain = true }]

[env.production.vars]
SERVICE_ENABLED = "false"
PUBLIC_URL = "https://kommandekollen.se/"
ALLOWED_ORIGINS = "https://kommandekollen.se"
MAIL_FROM = ""
PRIVACY_CONTACT = ""
AUTHORIZED_SOURCES = "[]"

[[env.production.d1_databases]]
binding = "DB"
database_name = "kommandekollen"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

[env.production.triggers]
crons = ["* * * * *"]
