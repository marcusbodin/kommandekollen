name = "kommandekollen-api"
main = "worker/index.ts"
compatibility_date = "2025-09-24"
workers_dev = true

[vars]
SERVICE_ENABLED = "false"
AI_ENABLED = "false"
ACCESS_MODE = "membership"
PUBLIC_URL = "http://localhost:5173/"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
MAIL_FROM = ""
PRIVACY_CONTACT = ""
AUTHORIZED_SOURCES = "[]"

[[d1_databases]]
binding = "DB"
database_name = "kommandekollen"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = false

# Shared-password pilot; email verification is required when saving.
[env.production]
name = "kommandekollen-api"
account_id = "1dce26e13a92cf0d959f0b9a9581d217"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.kommandekollen.se", custom_domain = true }]

[env.production.vars]
SERVICE_ENABLED = "true"
AI_ENABLED = "true"
ACCESS_MODE = "shared"
PUBLIC_URL = "https://kommandekollen.se/"
ALLOWED_ORIGINS = "https://kommandekollen.se"
# MAIL_FROM and PRIVACY_CONTACT are production secrets, not public vars.
AUTHORIZED_SOURCES = "[]"

[env.production.ai]
binding = "AI"

[[env.production.d1_databases]]
binding = "DB"
database_name = "kommandekollen"
database_id = "d46b497d-c4b5-47cb-8282-95317886a88e"
migrations_dir = "worker/migrations"

[env.production.triggers]
crons = ["* * * * *"]
