<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme = param === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Sök kommande bostäder i Stockholms län och bevaka dina önskemål. Se alltid aktuell källtäckning." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%assets/favicon-blue-32.png" />
    <title>Kommandekollen – kommande bostäder i Stockholm</title>
  </head>
  <body>
    <!-- THESIS: A property-search workbench, not a marketing landing page.
    OWN-WORLD: Neutral surfaces and liquid glass, supplied blue/radar logo, blue/ice/coral buttons, bold Georgia headings and Segoe UI controls.
    STORY: Describe a home publicly; password and explicit AI consent follow submission, email follows saving.
    FIRST VIEWPORT: Brand/menu, search and purpose copy over the supplied interior; mobile orders heading before input.
    FORM: Reference-pinned compact Operate website; no visual tournament, invented coverage or changes to the save contract. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
