<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme = param === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Sök kommande bostäder i Stockholms län och bevaka dina önskemål. Se alltid aktuell källtäckning." />
    <meta name="color-scheme" content="light dark" />
    <title>Kommandekollen – kommande bostäder i Stockholm</title>
  </head>
  <body>
    <!-- THESIS: A property-search workbench, not a marketing landing page.
    OWN-WORLD: Light-first Clawpilot neutrals, rose actions, Segoe UI and labeled inspiration photography.
    STORY: Apply for membership or set preferences; compare facts without invented coverage.
    FIRST VIEWPORT: Compact home-photo introduction, explicit availability and touch-friendly tasks.
    FORM: User-pinned mobile Operate mode with native sliders and progressive optional filters. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
